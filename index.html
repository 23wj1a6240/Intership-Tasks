<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Home Risk Checker</title>
<style>
:root{--bg:#eef3f0;--surface:#fff;--ink:#12302f;--muted:#4f6663;--line:#cfdcd7;--accent:#0f6b66;--hi:#b3261e;--hib:#fbe3e0;--me:#8a5a00;--meb:#fff0cc;--lo:#1f6b35;--lob:#dcf1e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a19;--surface:#162826;--ink:#e6f1ee;--muted:#9bb5b0;--line:#2a403d;--accent:#5cc8bf;--hi:#ff9a92;--hib:#4a1f1c;--me:#f2c15e;--meb:#4a3a10;--lo:#8fdba3;--lob:#17381f}}
:root[data-theme="dark"]{--bg:#0e1a19;--surface:#162826;--ink:#e6f1ee;--muted:#9bb5b0;--line:#2a403d;--accent:#5cc8bf;--hi:#ff9a92;--hib:#4a1f1c;--me:#f2c15e;--meb:#4a3a10;--lo:#8fdba3;--lob:#17381f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:28px 20px 8px;max-width:1100px;margin:auto}
h1{font:700 clamp(26px,4vw,38px)/1.15 Georgia,"Iowan Old Style",Palatino,serif;margin:0 0 6px}
header p{margin:0;color:var(--muted);max-width:62ch}
main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;max-width:1100px;margin:auto;padding:16px 20px 40px}
@media(max-width:820px){main{grid-template-columns:1fr}}
fieldset{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:0 0 14px;padding:12px 16px 6px}
legend{font:700 18px Georgia,serif;padding:0 6px}
label{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
label:first-of-type{border-top:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin-top:2px}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.t{font-weight:600}.w{display:block;color:var(--muted);font-size:14px}
.chip{font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;margin-left:6px;border:1px solid currentColor;white-space:nowrap}
.Critical{color:var(--hi)}.High{color:var(--me)}.Medium{color:var(--accent)}.Low{color:var(--muted)}
aside{position:sticky;top:12px;align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
@media(max-width:820px){aside{position:static}}
h2{font:700 20px Georgia,serif;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.badge{font-weight:700;border-radius:6px;padding:2px 9px;display:inline-block}
.High-r{background:var(--hib);color:var(--hi)}.Medium-r{background:var(--meb);color:var(--me)}.Low-r{background:var(--lob);color:var(--lo)}
ol{padding-left:20px;margin:8px 0 14px}li{margin-bottom:6px}li small{color:var(--muted)}
button{font:inherit;font-weight:600;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:7px 14px;cursor:pointer}
.sc{font-size:14px;color:var(--muted);margin:0 0 10px}
</style>
</head>
<body>
<header>
<h1>Smart Home Risk Checker</h1>
<p>Tick each protection the family has already set up. The risk matrix and the to-do list update straight away. Ratings are a simple estimate based on unmet protections, not a security audit.</p>
</header>
<main>
<section id="groups" aria-label="Protections checklist"></section>
<aside aria-live="polite">
<h2>Device-risk matrix</h2>
<p class="sc" id="overall"></p>
<table><thead><tr><th>Device</th><th>Protected</th><th>Risk</th></tr></thead><tbody id="rows"></tbody></table>
<h2 style="margin-top:18px">Do these next</h2>
<ol id="todo"></ol>
<button id="reset" type="button">Clear all ticks</button>
</aside>
</main>
<script>
var W={Critical:4,High:3,Medium:2,Low:1};
var G=[
{n:"Smart camera",c:[
["Unique strong password set (not the default)","Critical","Default and reused passwords are the easiest way into a camera account."],
["Multi-factor authentication turned on","Critical","Stops a stolen password from giving access to live video."],
["Automatic firmware updates enabled","High","Updates close known vulnerabilities."],
["Not placed in bedrooms or bathrooms","High","Video of private rooms is the most damaging data to lose."],
["Privacy mode or schedule set for when the family is home","High","Less recording means less footage that can leak."],
["Update support period checked on the maker’s site","High","Unsupported devices collect unpatched flaws over time."],
["Cloud clips kept 30 days or less; microphone off if unused","Medium","Data that is deleted cannot be exposed later."]]},
{n:"Voice assistant",c:[
["Voice commands cannot unlock the door or disable alarms","Critical","A spoken command, even from the TV, must never open the house."],
["Unique password and multi-factor authentication on the account","Critical","The account holds voice history and linked services."],
["Purchases need a PIN or are switched off","High","Prevents accidental or unauthorised orders."],
["Update support period checked on the maker’s site","High","Support length varies a lot between models."],
["Voice history set to auto-delete","Medium","Reduces the stored record of private conversations."],
["Opted out of human review of recordings","Medium","Limits who may hear accidental recordings."],
["Mute button used when the assistant is not needed","Medium","A physical mute is the most reliable microphone control."]]},
{n:"Connected door lock",c:[
["Keypad PIN is long and random (no birthdays or 1234)","Critical","The PIN is the front-door key to the house."],
["Unique password and multi-factor authentication on the lock app","Critical","Account takeover can mean remote unlocking."],
["Guest codes are temporary and old codes are deleted","High","Forgotten access lets former guests or workers in."],
["Firmware is up to date","High","Lock flaws are physical-safety flaws."],
["Mechanical key and spare batteries kept ready","High","A dead battery or outage must not lock the family out."],
["Access log reviewed every month","Medium","Shows unknown users and when the house is empty."],
["Auto-unlock or geofencing switched off if unreliable","Low","Avoids doors opening when nobody expects it."]]},
{n:"Smart television",c:[
["TV is on the guest or IoT network","High","Keeps a weak TV away from phones and laptops."],
["Automatic updates on and update support checked","High","Smart TV software often loses support after a few years."],
["Strong password and multi-factor authentication on the TV account","High","Protects the viewing profile and purchases."],
["ACR and ad personalisation turned off","Medium","Stops the TV from profiling what the family watches."],
["Camera and microphone disabled or covered if unused","Medium","Removes a hidden recording source."],
["Unused apps removed","Low","Fewer apps means fewer data requests."],
["Plan to factory reset and sign out before selling or recycling","Low","Old TVs keep accounts and Wi-Fi details."]]},
{n:"Home network (covers all devices)",c:[
["Strong Wi-Fi password with WPA3 or WPA2-AES","Critical","Every device depends on the Wi-Fi."],
["Router admin password changed and router firmware updated","Critical","A weak router exposes the whole home."],
["Separate guest or IoT network created","High","Limits damage if one device is compromised."],
["WPS and UPnP turned off","Medium","Both can open the network without you noticing."]]}];
var st=[];G.forEach(function(g){st.push(g.c.map(function(){return false}))});
var gr=document.getElementById("groups");
G.forEach(function(g,i){
 var f=document.createElement("fieldset");var l=document.createElement("legend");l.textContent=g.n;f.appendChild(l);
 g.c.forEach(function(c,j){
  var lb=document.createElement("label");var cb=document.createElement("input");cb.type="checkbox";
  cb.addEventListener("change",function(){st[i][j]=cb.checked;render()});
  var d=document.createElement("div");
  var t=document.createElement("span");t.className="t";t.textContent=c[0];
  var ch=document.createElement("span");ch.className="chip "+c[1];ch.textContent=c[1];t.appendChild(ch);
  var w=document.createElement("span");w.className="w";w.textContent=c[2];
  d.appendChild(t);d.appendChild(w);lb.appendChild(cb);lb.appendChild(d);f.appendChild(lb);
  c.cb=cb;
 });
 gr.appendChild(f);
});
function level(p){return p>=45?"High":p>=20?"Medium":"Low"}
function render(){
 var rows=document.getElementById("rows");rows.innerHTML="";var todo=[];var tot=0,met=0;
 G.forEach(function(g,i){
  var total=0,done=0;
  g.c.forEach(function(c,j){var w=W[c[1]];total+=w;if(st[i][j])done+=w;else todo.push({w:w,t:c[0],d:g.n.split(" (")[0],p:c[1]})});
  tot+=total;met+=done;
  var unmet=100-Math.round(done/total*100);
  var lv=level(unmet);var pct=Math.round(done/total*100);
  var tr=document.createElement("tr");
  var a=document.createElement("td");a.textContent=g.n.split(" (")[0];
  var b=document.createElement("td");var bar=document.createElement("div");bar.className="bar";var ii=document.createElement("i");ii.style.width=pct+"%";bar.appendChild(ii);b.appendChild(bar);
  var c3=document.createElement("td");var s=document.createElement("span");s.className="badge "+lv+"-r";s.textContent=lv;c3.appendChild(s);
  tr.appendChild(a);tr.appendChild(b);tr.appendChild(c3);rows.appendChild(tr);
 });
 document.getElementById("overall").textContent="Overall: "+Math.round(met/tot*100)+"% of weighted protections in place.";
 todo.sort(function(x,y){return y.w-x.w});
 var ol=document.getElementById("todo");ol.innerHTML="";
 if(!todo.length){var li=document.createElement("li");li.textContent="All protections are in place. Schedule a quarterly review.";ol.appendChild(li)}
 todo.slice(0,6).forEach(function(x){var li=document.createElement("li");li.textContent=x.t+" ";var sm=document.createElement("small");sm.textContent="("+x.d+", "+x.p+")";li.appendChild(sm);ol.appendChild(li)});
}
document.getElementById("reset").addEventListener("click",function(){
 G.forEach(function(g,i){g.c.forEach(function(c,j){st[i][j]=false;c.cb.checked=false})});render();
});
render();
</script>
</body>
</html>
